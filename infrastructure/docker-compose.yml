name: fieldservice

services:
  db:
    image: postgres:17.11-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
      FIELDSERVICE_MIGRATOR_PASSWORD: "${FIELDSERVICE_MIGRATOR_PASSWORD:?}"
      FIELDSERVICE_APP_PASSWORD: "${FIELDSERVICE_APP_PASSWORD:?}"
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - fieldservice-pgdata:/var/lib/postgresql/data
      - ./postgres/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s

volumes:
  fieldservice-pgdata:
    name: fieldservice-pgdata

networks:
  default:
    name: fieldservice-net
    ipam:
      config:
        - subnet: "${NETWORK_SUBNET:-172.30.80.0/24}"
