name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "true"

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Create throwaway environment values
        run: node infrastructure/scripts/create-dev-env.mjs --ci
      - name: Start PostgreSQL from the Compose file
        run: docker compose -f infrastructure/docker-compose.yml up -d --wait --wait-timeout 120 db
      - name: Restore local tools
        run: dotnet tool restore
      - name: Restore packages in locked mode for Release
        run: dotnet restore tests/FieldService.Api.Tests/FieldService.Api.Tests.csproj --locked-mode -p:Configuration=Release
      - name: Verify formatting
        run: |
          dotnet format src/FieldService.Api/FieldService.Api.csproj --verify-no-changes --no-restore
          dotnet format tests/FieldService.Api.Tests/FieldService.Api.Tests.csproj --verify-no-changes --no-restore
      - name: Build
        run: dotnet build tests/FieldService.Api.Tests/FieldService.Api.Tests.csproj --configuration Release --no-restore
      - name: Publish the API
        run: dotnet publish src/FieldService.Api/FieldService.Api.csproj --configuration Release --no-build --output artifacts/publish/api
      - name: Fail when the Release output holds Swagger UI
        run: test -z "$(find src/FieldService.Api/bin/Release tests/FieldService.Api.Tests/bin/Release artifacts/publish/api -name Swashbuckle.AspNetCore.SwaggerUI.dll)"
      - name: Fail on model changes without a migration
        run: dotnet ef migrations has-pending-model-changes --project src/FieldService.Api --configuration Release --no-build
        env:
          ConnectionStrings__Migrations: Host=127.0.0.1;Port=5433;Database=fieldservice;Username=fieldservice_migrator
      - name: Test
        run: dotnet test --project tests/FieldService.Api.Tests --configuration Release --no-build --results-directory artifacts/test-results/api --coverlet --coverlet-output-format cobertura --filter-not-trait "Category=Quarantine" --timeout 20m
      - name: Run quarantined tests
        continue-on-error: true
        run: dotnet test --project tests/FieldService.Api.Tests --configuration Release --no-build --results-directory artifacts/test-results/api-quarantine --filter-trait "Category=Quarantine" --ignore-exit-code 8 --timeout 20m
      - name: Report vulnerable packages
        run: dotnet list tests/FieldService.Api.Tests/FieldService.Api.Tests.csproj package --vulnerable --include-transitive
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: artifacts/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Show database logs
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs --no-color db

  notifications:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            src/FieldService.Notifications/package-lock.json
            tests/FieldService.Notifications.Tests/package-lock.json
      - name: Install service dependencies
        working-directory: src/FieldService.Notifications
        run: npm ci --ignore-scripts
      - name: Verify registry signatures of the service dependencies
        working-directory: src/FieldService.Notifications
        run: npm audit signatures
      - name: Install test dependencies
        working-directory: tests/FieldService.Notifications.Tests
        run: npm ci --ignore-scripts
      - name: Verify registry signatures of the test dependencies
        working-directory: tests/FieldService.Notifications.Tests
        run: npm audit signatures
      - name: Lint
        working-directory: src/FieldService.Notifications
        run: npm run lint
      - name: Check formatting of the service and its tests
        working-directory: src/FieldService.Notifications
        run: npm run format:check
      - name: Type-check the service
        working-directory: src/FieldService.Notifications
        run: npm run typecheck
      - name: Type-check the tests
        working-directory: tests/FieldService.Notifications.Tests
        run: npm run typecheck
      - name: Build
        working-directory: src/FieldService.Notifications
        run: npm run build
      - name: Test
        working-directory: src/FieldService.Notifications
        run: npm test
      - name: Audit runtime dependencies
        working-directory: src/FieldService.Notifications
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all service dependencies
        working-directory: src/FieldService.Notifications
        run: npm audit --audit-level=high
      - name: Audit test dependencies
        working-directory: tests/FieldService.Notifications.Tests
        run: npm audit --audit-level=high
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: notifications-test-results
          path: tests/FieldService.Notifications.Tests/test-results
          retention-days: 7
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/FieldService.Web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/FieldService.Web/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Create API types from the contract
        run: npm run generate:api
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm test -- --coverage
      - name: Build
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: src/FieldService.Web/coverage
          retention-days: 7
          if-no-files-found: ignore

  mobile-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "21"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install the Android workload set
        run: dotnet workload install maui-android --version 10.0.402
      - name: Show the installed workloads
        run: dotnet workload list
      - name: Restore
        run: dotnet restore tests/FieldService.Mobile.Tests/FieldService.Mobile.Tests.csproj
      - name: Verify formatting
        run: |
          dotnet format src/FieldService.Mobile/FieldService.Mobile.csproj --verify-no-changes --no-restore
          dotnet format tests/FieldService.Mobile.Tests/FieldService.Mobile.Tests.csproj --verify-no-changes --no-restore
      - name: Test
        run: dotnet test --project tests/FieldService.Mobile.Tests --configuration Release -p:ApiBaseUrl=https://fieldservice.example --results-directory artifacts/test-results/mobile --coverlet --coverlet-output-format cobertura --filter-not-trait "Category=Quarantine" --timeout 15m
      - name: Run quarantined tests
        continue-on-error: true
        run: dotnet test --project tests/FieldService.Mobile.Tests --configuration Release -p:ApiBaseUrl=https://fieldservice.example --no-build --results-directory artifacts/test-results/mobile-quarantine --filter-trait "Category=Quarantine" --ignore-exit-code 8 --timeout 15m
      - name: Publish the Release APK
        run: dotnet publish src/FieldService.Mobile/FieldService.Mobile.csproj --framework net10.0-android --configuration Release -p:ApiBaseUrl=https://fieldservice.example -p:AndroidPackageFormats=apk --output artifacts/android
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: fieldservice-android
          path: artifacts/android/*-Signed.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-test-results
          path: artifacts/test-results
          retention-days: 7
          if-no-files-found: ignore

  mobile-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install the Windows and Android workload sets
        run: dotnet workload install maui-windows maui-android --version 10.0.402
      - name: Show the installed workloads
        run: dotnet workload list
      - name: Publish the Windows app
        run: dotnet publish src/FieldService.Mobile/FieldService.Mobile.csproj --framework net10.0-windows10.0.19041.0 --configuration Release -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None -p:ApiBaseUrl=https://fieldservice.example --output artifacts/windows
      - name: Upload the Windows app
        uses: actions/upload-artifact@v7
        with:
          name: fieldservice-windows
          path: artifacts/windows
          retention-days: 7
          if-no-files-found: error

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Scan files for comments
        run: node infrastructure/scripts/check-no-comments.mjs
      - name: Check tracked files and scan their content for secrets
        run: node infrastructure/scripts/check-tracked-files.mjs

  e2e:
    needs:
      - api
      - notifications
      - web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      E2E_BASE_URL: http://127.0.0.1:8081
      E2E_LOGS_DIR: ../../logs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/FieldService.Web/package-lock.json
      - name: Create throwaway environment values
        run: node infrastructure/scripts/create-dev-env.mjs --ci
      - name: Give the log folders to the container users
        run: |
          mkdir -p logs/api logs/notifications
          chmod 0755 logs/api logs/notifications
          sudo chown 1654:1654 logs/api
          sudo chown 1000:1000 logs/notifications
          stat -c '%u:%g %a %n' logs/api logs/notifications
      - name: Show the Docker and Compose versions
        run: |
          docker version
          docker compose version
      - name: Build and start the full stack
        run: docker compose -f infrastructure/docker-compose.yml --profile full up -d --build --wait --wait-timeout 300
      - name: Wait for API readiness
        run: curl --fail --silent --show-error --connect-timeout 2 --max-time 5 --retry 60 --retry-delay 2 --retry-max-time 150 --retry-all-errors http://127.0.0.1:5080/health/ready
      - name: Install web dependencies
        working-directory: src/FieldService.Web
        run: npm ci --ignore-scripts
      - name: Verify registry signatures
        working-directory: src/FieldService.Web
        run: npm audit signatures
      - name: Install Chromium
        working-directory: src/FieldService.Web
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: src/FieldService.Web
        run: npm run test:e2e
      - name: List quarantined end-to-end tests
        id: e2e-quarantine-list
        working-directory: src/FieldService.Web
        run: |
          listing=$(npx playwright test --project=compose --list --grep @quarantine --pass-with-no-tests --reporter=list)
          printf '%s\n' "$listing"
          count=$(printf '%s\n' "$listing" | sed -n -E 's/^Total: ([0-9]+) tests? in [0-9]+ files?$/\1/p')
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "The quarantine listing printed no test count" >&2
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No test is tagged @quarantine, so the quarantine run is skipped"
          fi
      - name: Run quarantined end-to-end tests
        id: e2e-quarantine
        if: steps.e2e-quarantine-list.outputs.count != '0'
        working-directory: src/FieldService.Web
        continue-on-error: true
        run: npx playwright test --project=compose --grep @quarantine --pass-with-no-tests
      - name: Show the container states and recent logs
        if: failure()
        run: |
          docker compose -f infrastructure/docker-compose.yml --profile full ps --all
          docker compose -f infrastructure/docker-compose.yml logs --no-color db
          docker compose -f infrastructure/docker-compose.yml --profile full logs --no-color --tail 100 migrate api notifications web
      - name: Collect container logs
        if: failure() || steps.e2e-quarantine.outcome == 'failure'
        run: docker compose -f infrastructure/docker-compose.yml --profile full logs --no-color migrate api notifications web > compose.log
      - name: Upload diagnostics
        if: failure() || steps.e2e-quarantine.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            src/FieldService.Web/playwright-report
            src/FieldService.Web/test-results
            !src/FieldService.Web/test-results/sentinels/**
            logs
            compose.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml --profile full down -v

  ci-passed:
    if: always()
    needs:
      - api
      - notifications
      - web
      - mobile-android
      - mobile-windows
      - hygiene
      - e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when a required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Confirm
        run: echo "All required jobs succeeded"
